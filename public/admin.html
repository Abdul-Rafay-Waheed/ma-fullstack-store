<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MA / Store Administration</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/"><img src="/assets/brand-logo.png" alt="MA"></a><div><small>MA / STORE MANAGEMENT</small><h1>Administration</h1></div><a href="/">← View storefront</a></header><main><section id="login" class="panel login"><small>SECURE STORE ACCESS</small><h2>Welcome back.</h2><form id="loginForm"><label>Username<input name="username" value="admin" required></label><label>Password<input name="password" type="password" required></label><button>Sign in ↗</button><p id="loginMsg"></p><small>Initial local demo password is shown in README. Change it before deployment.</small></form></section><section id="dashboard" hidden><div class="topline"><div><small>STORE OVERVIEW</small><h2>Good day.</h2></div><button id="logout">Sign out</button></div><div class="stats" id="stats"></div><div class="tabs"><button class="active" data-tab="orders">Orders</button><button data-tab="products">Products & stock</button><button data-tab="subscribers">Newsletter</button></div><section class="panel" id="ordersPanel"><div class="panel-title"><h3>Recent orders</h3><button id="refreshOrders">Refresh</button></div><div id="ordersTable"></div></section><section class="panel" id="productsPanel" hidden><div class="panel-title"><h3>Product inventory</h3><button id="newProduct">+ Add product</button></div><div id="productsTable"></div><form id="productForm" hidden><h3 id="productFormTitle">Add product</h3><div class="form-grid"><label>Product ID<input name="id" required placeholder="e.g. p13"></label><label>Product name<input name="name" required></label><label>Category<select name="category"><option value="perfume">Perfume</option><option value="fabric">Unstitched</option></select></label><label>Price (PKR)<input name="price" type="number" min="0" required></label><label>Stock<input name="stock" type="number" min="0" value="10"></label><label>Tag<input name="tag"></label><label>Fragrance family<input name="family"></label><label>Size<input name="size"></label><label>Notes<input name="notes"></label><label>Fabric type<input name="fabric_type"></label><label>Colour<input name="color"></label><label>Image ID (Unsplash photo ID)<input name="image" required placeholder="photo-..."></label><label class="span">Description<textarea name="description" required rows="3"></textarea></label></div><div class="form-actions"><button type="submit">Save product</button><button type="button" id="cancelProduct">Cancel</button></div><p id="productMsg"></p></form></section><section class="panel" id="subscribersPanel" hidden><div class="panel-title"><h3>Newsletter subscribers</h3></div><div id="subscribersTable"></div></section></section></main><script src="/admin.js"></script></body></html>
